name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test

permissions:
  contents: read

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - elixir: "1.18.0"
            otp: "26"
          - elixir: "1.19"
            otp: "28"
          - elixir: "1.20.4"
            otp: "28"
          - elixir: "1.20.4"
            otp: "29"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - uses: actions/cache@v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get
      - run: mix validate
      - name: Verify pinned CCK provenance
        if: matrix.elixir == '1.20.4' && matrix.otp == '29'
        run: mix run scripts/check_cck.exs
        env:
          GH_TOKEN: ${{ github.token }}

  resolve-dependencies:
    name: Generate dependency lockfile
    if: github.event_name == 'pull_request' && github.head_ref == 'chore/dependencies-2026-10-19'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: "1.20.4"
          otp-version: "29.1.2"
      - name: Resolve all dependencies with Mix
        run: |
          mix deps.update --all
          git diff --check
          git diff -- mix.lock
        env:
          MIX_ENV: dev
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: resolved-mix-lock
          path: mix.lock
          if-no-files-found: error
          retention-days: 1

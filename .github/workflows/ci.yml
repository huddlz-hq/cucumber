name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test

permissions:
  contents: read

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - elixir: "1.18.0"
            otp: "26"
          - elixir: "1.19"
            otp: "28"
          - elixir: "1.20.2"
            otp: "28"
          - elixir: "1.20.2"
            otp: "29"
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get
      - run: mix validate
      - name: Verify pinned CCK provenance
        if: matrix.elixir == '1.20.2' && matrix.otp == '29'
        run: mix run scripts/check_cck.exs
        env:
          GH_TOKEN: ${{ github.token }}

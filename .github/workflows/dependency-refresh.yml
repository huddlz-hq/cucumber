name: Resolve dependency refresh
on:
  push:
    branches: [chore/dependencies-2026-10-26]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: '29.1.2'
          elixir-version: '1.20.4'
      - run: mix deps.update --all
      - run: mix hex.outdated
        continue-on-error: true
      - run: mix hex.audit
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: resolved-dependencies
          include-hidden-files: true
          path: |
            mix.lock

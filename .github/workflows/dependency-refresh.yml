name: Verify dependency refresh
on:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: '29.1.2'
          elixir-version: '1.20.5'
      - run: mix deps.get
      - run: mix precommit
      - run: git diff --exit-code
